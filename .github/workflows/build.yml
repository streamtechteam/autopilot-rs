name: Build and Release

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release?'
        required: true
        type: boolean
        default: false
      tag_name:
        description: 'Release tag (e.g., v1.0.0)'
        required: false
        type: string
        default: ''
      release_name:
        description: 'Release name/title'
        required: false
        type: string
        default: ''
      prerelease:
        description: 'Mark as pre-release?'
        required: false
        type: boolean
        default: false
      draft:
        description: 'Create as draft?'
        required: false
        type: boolean
        default: false
      release_notes:
        description: 'Custom release notes (leave empty for auto-generated)'
        required: false
        type: string
        default: ''

env:
  CARGO_TERM_COLOR: always

jobs:
  # ============================================
  # BUILD JOBS
  # ============================================

  build:
    name: Build - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            artifact_name: autopilot-rs-linux-latest
            asset_name: autopilot-rs-linux
          - os: windows-latest
            artifact_name: autopilot-rs-windows
            asset_name: autopilot-rs-windows.exe
          - os: macos-latest
            artifact_name: autopilot-rs-macos
            asset_name: autopilot-rs-macos

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb1-dev libxcb1 libxau6 libxau-dev libxrandr2 libxrandr-dev

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release -p autopilot-rs

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --release -p autopilot-rs --locked -- -D warnings

      - name: Prepare Artifact
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp target/release/autopilot-rs.exe dist/${{ matrix.asset_name }}
          else
            cp target/release/autopilot-rs dist/${{ matrix.asset_name }}
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.asset_name }}

  build-linux-compat:
    name: Build Linux (Fedora 35 - glibc 2.34)
    runs-on: ubuntu-latest
    container:
      image: fedora:35
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust and dependencies
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          source $HOME/.cargo/env
          dnf install -y gcc libxcb-devel libxcb libXau libXau-devel libXrandr libXrandr-devel

      - name: Build
        run: |
          source $HOME/.cargo/env
          cargo build --release -p autopilot-rs

      - name: Prepare Compatible Binary
        run: |
          mkdir -p dist
          cp target/release/autopilot-rs dist/autopilot-rs-linux-glibc2.34
          objdump -T dist/autopilot-rs-linux-glibc2.34 | grep GLIBC | sort -u

      - name: Upload Compatible Binary
        uses: actions/upload-artifact@v4
        with:
          name: autopilot-rs-linux-compatible
          path: dist/autopilot-rs-linux-glibc2.34

  build-rpm:
    name: Build RPM Package
    runs-on: ubuntu-latest
    needs: [build, build-linux-compat]
    container:
      image: fedora:35

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust and dependencies
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source $HOME/.cargo/env
          dnf install -y gcc rpm-build cargo libxcb-devel libxcb libXau libXau-devel libXrandr libXrandr-devel

      - name: Build RPM
        working-directory: crates/autopilot-cli
        run: |
          source $HOME/.cargo/env
          cargo install cargo-rpm || true
          cargo rpm build

      - name: Find RPM
        id: find_rpm
        run: |
          RPM_PATH=$(find . -path '*rpmbuild/RPMS*' -name "*.rpm" | head -1)
          echo "rpm_path=$RPM_PATH" >> $GITHUB_OUTPUT
          echo "rpm_name=$(basename "$RPM_PATH")" >> $GITHUB_OUTPUT

      - name: Upload RPM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: autopilot-rs-rpm
          path: ${{ steps.find_rpm.outputs.rpm_path }}

  build-deb:
    name: Build DEB Package
    runs-on: ubuntu-latest
    needs: [build, build-linux-compat]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb1-dev libxcb1 libxau6 libxau-dev libxrandr2 libxrandr-dev

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-deb
        run: cargo install cargo-deb

      - name: Build DEB
        run: cargo deb -p autopilot-rs

      - name: Find DEB
        id: find_deb
        run: |
          DEB_PATH=$(find target/debian -name "*.deb" | head -1)
          echo "deb_path=$DEB_PATH" >> $GITHUB_OUTPUT
          echo "deb_name=$(basename "$DEB_PATH")" >> $GITHUB_OUTPUT

      - name: Upload DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: autopilot-rs-deb
          path: ${{ steps.find_deb.outputs.deb_path }}

  build-arch:
    name: Build Arch Package
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install system dependencies
        run: |
          pacman -Syu --noconfirm base-devel rust cargo git sudo libxcb libxrandr libx11 libxau
      - uses: actions/checkout@v4
      - name: Build Package
        run: |
          useradd -m builduser
          echo "builduser ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builduser:builduser .
          sudo -u builduser makepkg -sc --noconfirm
      - name: Upload Arch Artifact
        uses: actions/upload-artifact@v4
        with:
          name: autopilot-rs-arch
          path: "*.pkg.tar.zst"

  build-msi:
    name: Build Windows MSI
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-wix
        run: cargo install cargo-wix

      - name: Build and Package MSI
        working-directory: crates/autopilot-cli
        run: cargo wix -p autopilot-rs

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: autopilot-rs-msi
          path: |
            target/wix/*.msi
            crates/autopilot-cli/target/wix/*.msi

  build-dmg:
    name: Build macOS DMG
    runs-on: macos-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - name: Build Binary
        run: cargo build --release -p autopilot-rs
      - name: Install create-dmg
        run: brew install create-dmg
      - name: Create DMG
        run: |
          mkdir -p dist
          cp target/release/autopilot-rs dist/
          create-dmg \
            --volname "Autopilot Installer" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --icon "autopilot-rs" 200 190 \
            --hide-extension "autopilot-rs" \
            --app-drop-link 600 185 \
            "autopilot-rs.dmg" \
            "dist/"
      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: autopilot-rs-dmg
          path: "*.dmg"

  # ============================================
  # PACKAGE ARTIFACTS JOB
  # ============================================

  prepare-release-assets:
    name: Prepare Release Assets
    runs-on: ubuntu-latest
    needs: [build, build-linux-compat, build-rpm, build-deb, build-msi, build-arch, build-dmg]
    # Run on push to master OR on workflow_dispatch (regardless of release choice)
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      github.event_name == 'workflow_dispatch'

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: List downloaded artifacts
        run: find artifacts -type f -ls

      - name: Package for release
        run: |
          mkdir -p release

          # Copy binaries
          cp artifacts/autopilot-rs-linux-latest/autopilot-rs-linux release/ || true
          cp artifacts/autopilot-rs-linux-compatible/autopilot-rs-linux-glibc2.34 release/ || true
          cp artifacts/autopilot-rs-windows/autopilot-rs-windows.exe release/ || true
          cp artifacts/autopilot-rs-macos/autopilot-rs-macos release/ || true

          # Copy installers
          cp artifacts/autopilot-rs-msi/*.msi release/ || true
          cp artifacts/autopilot-rs-arch/*.pkg.tar.zst release/ || true
          cp artifacts/autopilot-rs-dmg/*.dmg release/ || true
          cp artifacts/autopilot-rs-rpm/*.rpm release/ || true
          cp artifacts/autopilot-rs-deb/*.deb release/ || true

          # Generate checksums
          cd release
          sha256sum * > SHA256SUMS

          # List final release assets
          echo "=== Release Assets ==="
          ls -la

      - name: Upload prepared release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release/
          retention-days: 1

  # ============================================
  # RELEASE JOB (Separate - Requires Confirmation)
  # ============================================

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [prepare-release-assets]
    # Only run when:
    # 1. workflow_dispatch is triggered AND create_release is true
    if: github.event_name == 'workflow_dispatch' && inputs.create_release == true

    permissions:
      contents: write

    env:
      TAG_NAME: ${{ inputs.tag_name }}
      RELEASE_NAME: ${{ inputs.release_name }}
      RELEASE_NOTES: ${{ inputs.release_notes }}
      PRERELEASE: ${{ inputs.prerelease }}
      DRAFT: ${{ inputs.draft }}

    steps:
      - name: Validate tag name
        run: |
          if [ -z "$TAG_NAME" ]; then
            echo "Error: tag_name is required when creating a release"
            exit 1
          fi
          if ! [[ "$TAG_NAME" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Error: invalid tag name '$TAG_NAME' (expected vMAJOR.MINOR.PATCH)"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release/

      - name: Generate version info
        id: version
        run: |
          # Remove 'v' prefix if present for version number
          VERSION="${TAG_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Prepare release notes
        id: notes
        run: |
          DELIMITER="EOF_$(date +%s%N)_${RANDOM}${RANDOM}"
          VERSION="${TAG_NAME#v}"
          RELEASE_DATE="$(date +'%Y-%m-%d')"

          {
            echo "body<<$DELIMITER"
            if [ -n "$RELEASE_NOTES" ]; then
              # Treat custom notes as literal text; never evaluate them.
              printf '%s\n' "$RELEASE_NOTES"
            else
              echo "## Release $VERSION"
              echo ""
              echo "**Release Date:** $RELEASE_DATE"
              echo ""
              echo "### What's Changed"
              echo ""
              git log --pretty=format:"- %s (%h)" HEAD~10..HEAD 2>/dev/null || true
              echo ""
            fi
            echo "$DELIMITER"
          } >> "$GITHUB_OUTPUT"

      - name: Display release info
        run: |
          echo "========================================="
          echo "Creating Release with the following info:"
          echo "========================================="
          echo "Tag: $TAG_NAME"
          echo "Name: ${RELEASE_NAME:-Release $TAG_NAME}"
          echo "Pre-release: $PRERELEASE"
          echo "Draft: $DRAFT"
          echo "========================================="
          echo ""
          echo "Assets to be uploaded:"
          ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          name: ${{ inputs.release_name || format('Release {0}', inputs.tag_name) }}
          body: ${{ steps.notes.outputs.body }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: ${{ inputs.release_notes == '' }}
          files: release/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release Summary
        run: |
          {
            echo "## ✅ Release Created Successfully!"
            echo ""
            echo "**Tag:** $TAG_NAME"
            echo "**Name:** ${RELEASE_NAME:-Release $TAG_NAME}"
            echo "**Pre-release:** $PRERELEASE"
            echo "**Draft:** $DRAFT"
            echo ""
            echo "### Uploaded Assets"
            ls -la release/
          } >> "$GITHUB_STEP_SUMMARY"
