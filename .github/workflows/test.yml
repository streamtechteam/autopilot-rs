name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb1-dev libxcb1 libxau6 libxau-dev libxrandr2 libxrandr-dev

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        shell: bash
        run: |
          cargo fmt --check > /tmp/fmt.txt 2>&1 || true
          tr -d '\r' < /tmp/fmt.txt | grep -E '^Diff in ' | sed "s|Diff in $GITHUB_WORKSPACE/||" | while IFS= read -r line; do echo "::error::$line"; done
          tr -d '\r' < /tmp/fmt.txt | grep -E '^[+-] ' | head -20 | while IFS= read -r line; do echo "::notice::CTX $line"; done
          exit 1

      - name: Run clippy
        run: cargo clippy --workspace --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --locked
