name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb1-dev libxcb1 libxau6 libxau-dev libxrandr2 libxrandr-dev

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        shell: bash
        run: |
          cargo clippy --workspace --locked -- -D warnings > /tmp/clippy.txt 2>&1 || true
          tr -d '\r' < /tmp/clippy.txt | grep -E '^(error|warning)(:|\[)|-->' | head -30 | while IFS= read -r line; do echo "::error::CLIPPY $line"; done
          exit 1

      - name: Run tests
        run: cargo test --workspace --locked
