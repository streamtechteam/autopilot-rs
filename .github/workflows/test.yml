name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb1-dev libxcb1 libxau6 libxau-dev libxrandr2 libxrandr-dev

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --workspace --locked -- -D warnings

      - name: Run tests
        shell: bash
        run: |
          cargo test --workspace --locked > /tmp/test.txt 2>&1 || true
          sed 's/\x1b\[[0-9;]*m//g' /tmp/test.txt | tr -d '\r' | grep -aE 'FAILED|failures:|panicked|test result|^error(\[|:)| --> ' | head -40 | while IFS= read -r line; do echo "::error::TEST $line"; done
          exit 1
