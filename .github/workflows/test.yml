name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb1-dev libxcb1 libxau6 libxau-dev libxrandr2 libxrandr-dev

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --workspace --locked -- -D warnings

      - name: Run tests
        # TEMP-DIAG: dump raw test output tails as annotations. REVERT before merge.
        timeout-minutes: 15
        shell: bash
        run: |
          status=0
          cargo test --workspace --locked > /tmp/test.out 2>/tmp/test.err || status=$?
          echo "::notice title=diag-status::exit=$status"
          strip='s/\x1b\[[0-9;]*m//g'
          tail -n 45 /tmp/test.out | tr '\n' ';' | sed -e "$strip" | head -c 1500 | sed 's/^/::notice title=diag-out::/'
          tail -n 45 /tmp/test.err | tr '\n' ';' | sed -e "$strip" | head -c 1500 | sed 's/^/::notice title=diag-err::/'
          exit $status
