[workspace]
resolver = "2"
members = [
    "crates/autopilot-core",
    "crates/autopilot-api",
    "crates/autopilot-gui",
    "crates/autopilot-cli",
    "crates/autopilot-ui-api",
]

[workspace.package]
version = "0.1.0-beta.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/streamtechteam/autopilot_rs"
authors = ["Taha"]

[workspace.dependencies]
async-trait = "0.1.89"
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4.5.56", features = ["cargo", "derive"] }
colored = "3.0.0"
crossterm = "0.29.0"
dialoguer = "0.12.0"
display-info = "0.5"
duct = "1.1.1"
duct_sh = "1.0.0"
eframe = "0.33.3"
egui = "0.33.3"
egui_extras = "0.33.3"
axum = "0.8.8"
flexi_logger = "0.31.7"
futures = "0.3.31"
log = "0.4.28"
once_cell = "1.21.4"
rayon = "1.11.0"
ratatui = "0.30.0"
regex = "1.12.3"
schemars = "1.2.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
strum = { version = "0.27.2", features = ["derive"] }
sysinfo = { version = "0.33.1", default-features = false, features = ["disk", "system"] }
thiserror = "2.0.10"
tokio = { version = "1.48.0", features = ["full"] }
tokio-cron-scheduler = "0.15.1"
walkdir = "2.5.0"

autopilot-core = { path = "crates/autopilot-core" }
autopilot-api = { path = "crates/autopilot-api" }
autopilot-gui = { path = "crates/autopilot-gui" }
autopilot-ui-api = { path = "crates/autopilot-ui-api" }

[profile.release]
lto = "thin"
codegen-units = 1
